
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- External CSS -->
    <link rel="stylesheet" href="form.css">
</head>


<body>

    <main class="page">
        <section class="form-card">
           <div class="form-header">
                <p class="eyebrow">
                    CREATE YOUR ACCOUNT
                </p>
                <h1>
                    Join the <span>community.</span>
                </h1>
                <p>
                    Create your account and start your journey.
                </p>
            </div>
            <form>

                <div class="name-row">
                    <div class="field">
                        <label for="first-name">
                            First Name
                        </label>
                        <input
                            type="text"
                            id="first-name"
                            name="first-name"
                            placeholder="Laraib"
                            required>
                    </div>


                    <div class="field">
                        <label for="last-name">
                            Last Name
                        </label>
                        <input
                            type="text"
                            id="last-name"
                            name="last-name"
                            placeholder="Zafar"
                            required>
                    </div>
                </div>

                <div class="field">
                    <label for="email">
                        Email Address
                    </label>
                    <div class="input-wrapper">
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            required>

                        <span class="input-icon">
                            ✉
                        </span>
                    </div>
               </div>

                <div class="field">
                    <label for="password">
                        Password
                    </label>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            minlength="8"
                            required>

                        <span class="input-icon">
                            🔒
                        </span>
                    </div>
                    <small>
                        Minimum 8 characters
                    </small>

                </div>

                <div class="field">
                    <label for="confirm-password">
                        Confirm Password
                    </label>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Confirm your password"
                            minlength="8"
                            required>

                        <span class="input-icon">
                            ✓
                        </span>
                    </div>
                </div>

                  <fieldset class="gender">
                    <legend>
                        Gender
                    </legend>
                    <div class="radio-group">
                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="male">
                            Male
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="female">
                            Female
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="other">
                            Other
                        </label>
                    </div>
                </fieldset>

                <div class="field">
                    <label for="country">
                        Country
                    </label>
                    <select id="country" name="country" required>
                        <option value="">
                            Select your country
                        </option>

                        <option value="pakistan">
                            Pakistan
                        </option>

                        <option value="india">
                            India
                        </option>

                        <option value="uae">
                            United Arab Emirates
                        </option>

                        <option value="uk">
                            United Kingdom
                        </option>

                        <option value="usa">
                            United States
                        </option>

                        <option value="canada">
                            Canada
                        </option>

                        <option value="other">
                            Other
                        </option>
                    </select>
                </div>

                <div class="checkbox-group">
                    <label>
                        <input
                            type="checkbox"
                            name="terms"
                            required>

                        <span>
                            I agree to the
                            <a href="#">Terms & Conditions</a>
                        </span>
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="newsletter"
                        >
                        <span>
                            Subscribe me to the newsletter
                        </span>
                    </label>
                </div>

                <button type="submit">
                    Create Account
                </button>
            </form>
        </section>
    </main>
</body>
</html>
